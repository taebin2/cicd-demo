<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .status {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .check-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CI/CD Demo</h1>
        <div class="status">✅ 테스트 테스트 배포 성공!</div>
        <p>GitHub Actions와 Docker를 활용한<br>자동 배포 파이프라인이 정상 동작합니다.</p>
        <button class="check-btn" onclick="checkHealth()">DB 연결 확인</button>
        <div id="result"></div>
    </div>

    <script>
        async function checkHealth() {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.className = '';
            result.textContent = '확인 중...';

            try {
                const response = await fetch('/health');
                const data = await response.json();

                if (data.db === 'connected') {
                    result.className = 'success';
                    result.textContent = '✅ DB 연결 성공!';
                } else {
                    result.className = 'error';
                    result.textContent = '❌ DB 연결 실패: ' + (data.error || 'Unknown error');
                }
            } catch (e) {
                result.className = 'error';
                result.textContent = '❌ 요청 실패: ' + e.message;
            }
        }
    </script>
</body>
</html>
